name: Verify R008 release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install primary exact-verifier dependency
        run: python -m pip install -r requirements.txt
      - name: Replay full release verification
        run: python verify_release.py

  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Rebuild manuscript deterministically
        run: |
          cd manuscript
          SOURCE_DATE_EPOCH=1786691080 FORCE_SOURCE_DATE=1 \
            latexmk -pdf -interaction=nonstopmode -halt-on-error r008_far_pair_constraints.tex
      - name: Check rebuilt PDF hash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("manuscript")
          meta = json.loads((root / "build-metadata.json").read_text())
          got = hashlib.sha256((root / "r008_far_pair_constraints.pdf").read_bytes()).hexdigest()
          assert got == meta["pdfSha256"], (got, meta["pdfSha256"])
          print("MANUSCRIPT REBUILD VERIFIED")
          PY

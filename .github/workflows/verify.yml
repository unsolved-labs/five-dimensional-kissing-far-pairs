name: Verify R008 theorem

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact verifier dependency
        run: python -m pip install -r requirements.txt
      - name: Replay exact certificates
        run: python verifier.py

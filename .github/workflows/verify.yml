name: Verify R008 release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exact-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install primary exact-verifier dependency
        run: python -m pip install -r requirements.txt
      - name: Replay full release verification
        run: python verify_release.py

  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended
      - name: Rebuild manuscript from public source
        run: |
          cd manuscript
          SOURCE_DATE_EPOCH=1786691080 FORCE_SOURCE_DATE=1 \
            latexmk -pdf -interaction=nonstopmode -halt-on-error r008_far_pair_constraints.tex
      - name: Validate compiled PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("manuscript/r008_far_pair_constraints.pdf")
          assert p.exists() and p.read_bytes().startswith(b"%PDF-")
          print("MANUSCRIPT COMPILED FROM PUBLIC SOURCE")
          PY
      - name: Publish manuscript PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: r008-manuscript
          path: manuscript/r008_far_pair_constraints.pdf

  lean-exact-certificate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate exact Bernstein and Gegenbauer artifacts
        run: |
          python certificates/generate_bernstein_certificates.py
          python certificates/generate_lean_certificate_proofs.py
          python certificates/generate_gegenbauer_reference.py
      - name: Independently verify exact artifacts
        run: |
          python certificates/verify_bernstein_certificates.py
          python certificates/verify_sturm_crosscheck.py
          python certificates/verify_gegenbauer_reference.py
      - name: Verify expected Bernstein certificate identity
        run: |
          python - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('certificates/bernstein_certificates.json')
          got = hashlib.sha256(p.read_bytes()).hexdigest()
          expected = '500ca358f1055da735e28d8f7998bebadca0abf7105c67046269c04e3628e55b'
          assert got == expected, (got, expected)
          print('R008 Bernstein certificate identity verified:', got)
          PY

  lean-build:
    runs-on: ubuntu-latest
    needs: lean-exact-certificate-data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize deterministic generated Lean sources
        run: |
          python certificates/generate_bernstein_certificates.py
          python certificates/generate_lean_certificate_proofs.py
          python certificates/generate_gegenbauer_reference.py
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          build-args: '--wfail'
          leanchecker: false
          nanoda: false
      - name: Replay R008 with Lean's environment checker
        run: lake env leanchecker R008
      - name: Check R008 with nanoda external type checker
        run: |
          set -euo pipefail
          trap 'rm -rf _lean4export _nanoda_lib _nanoda_export.txt _nanoda_config.json' EXIT

          mkdir _lean4export
          git -C _lean4export init -q
          git -C _lean4export remote add origin https://github.com/leanprover/lean4export.git
          git -C _lean4export fetch -q --depth 1 origin b18d673bd29b476466a51a3be1012df2ed322b10
          git -C _lean4export checkout -q FETCH_HEAD
          cp lean-toolchain _lean4export/
          (cd _lean4export && lake build)

          mkdir _nanoda_lib
          git -C _nanoda_lib init -q
          git -C _nanoda_lib remote add origin https://github.com/ammkrn/nanoda_lib.git
          git -C _nanoda_lib fetch -q --depth 1 origin e5438ac0a85a036b6dfe093aa457bc3448498014
          git -C _nanoda_lib checkout -q FETCH_HEAD
          cargo build --release --manifest-path _nanoda_lib/Cargo.toml

          lake env _lean4export/.lake/build/bin/lean4export R008 > _nanoda_export.txt
          cat > _nanoda_config.json <<'JSON'
          {
            "export_file_path": "_nanoda_export.txt",
            "use_stdin": false,
            "permitted_axioms": ["propext", "Classical.choice", "Quot.sound", "Lean.trustCompiler"],
            "unpermitted_axiom_hard_error": false,
            "nat_extension": true,
            "string_extension": true,
            "print_success_message": true
          }
          JSON
          _nanoda_lib/target/release/nanoda_bin _nanoda_config.json
      - name: Reject proof placeholders and native-decision trust
        run: |
          if grep -RInE --include='*.lean' '^[[:space:]]*(by[[:space:]]+)?(sorry|admit|axiom|native_decide)\b' R008 R008.lean; then
            echo 'Forbidden local axiom, proof placeholder, or native_decide found.' >&2
            exit 1
          fi
      - name: Check staged entry point
        run: lake env lean R008.lean
      - name: Materialize verified generated sources
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add R008/Generated certificates/bernstein_certificates.json certificates/certificate_summary.json certificates/gegenbauer_reference.json certificates/gegenbauer_reference_summary.json
          if git diff --cached --quiet; then
            echo 'Generated formalization artifacts already materialized.'
            exit 0
          fi
          git commit -m 'Materialize verified R008 Lean generated sources'
          git push origin HEAD:"${HEAD_REF}"
